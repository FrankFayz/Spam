<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 10px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .result.spam {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .result.not-spam {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
    </style>
</head>
<body>      
    <div class="container">
        <h1>Spam Detector</h1>
        <form method="post">
            {% csrf_token %}
            <textarea name="message" placeholder="Enter your message here..." required></textarea>
            <button type="submit">Predict</button>
        </form>
        {% if result %}
            <div class="result">
                <h2>Prediction: {{ result }}</h2>
            </div>
        {% endif %}
    </div>
</body>
</html>
